[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wiretype"
version = "0.1.0"
description = "Predicting cell identity in a new connectome from wiring learned on another"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.1",
    "torch-geometric>=2.5",  # the graph-network baselines
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14.0",         # the FlyWire edge list ships as feather
    "scikit-learn>=1.3",     # probes over frozen embeddings
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wiretype*"]

[tool.setuptools.package-data]
"wiretype.data" = ["column_sets/*.json"]
